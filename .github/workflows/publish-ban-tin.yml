name: Publish Bản Tin Giao Thương

on:
  push:
    branches: [master]
    paths:
      - 'submissions/*.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xử lý submission và tạo trang embed
        run: node .github/scripts/publish-ban-tin.js

      - name: Commit và push
        run: |
          git config user.name "HAWEE Bot"
          git config user.email "bot@hawee.vn"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish ban tin tu submission"
          git push
